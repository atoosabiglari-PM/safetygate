name: SafetyGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SafetyGate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install OPA 1.20.2
        run: |
          curl -fL -o /tmp/opa https://openpolicyagent.org/downloads/v1.20.2/opa_linux_amd64_static
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Validate Rego policy
        run: |
          opa fmt --fail policies/rego/runtime.rego policies/rego/runtime_test.rego > /dev/null
          opa check --strict policies/rego
          opa test policies/rego -v

      - name: Run tests
        run: python -m pytest -q
